<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="buildlog-token" content="{{TOKEN}}">
<title>Buildlog 검토</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>Buildlog 검토</h1>
  <form id="search-form" class="search" role="search">
    <input id="search-input" type="search" placeholder="검색어 (예: ORA-12541, 사업자번호)" aria-label="검색어">
    <button type="submit">검색</button>
  </form>
  <label class="control">저장 실행
    <select id="run-select" aria-label="저장 실행"></select>
  </label>
  <label class="control"><input id="columns-toggle" type="checkbox"> 컬럼 표시</label>
  <span class="store" title="저장소">{{STORE}}</span>
</header>
<div id="status" class="status" role="status" aria-live="polite"></div>
<main class="layout">
  <section class="graph-pane" aria-label="그래프">
    <div id="graph"></div>
    <div class="legend" aria-hidden="true">
      <span class="lg created">새로 저장</span><span class="lg updated">갱신</span><span class="lg dirty">요약 갱신 필요</span>
      <span class="lg inferred">추정 관계</span>
    </div>
    <div id="graph-info" class="graph-info"></div>
    <ul id="node-list" class="node-list" aria-label="노드 목록"></ul>
  </section>
  <section id="panel" class="panel" aria-label="상세">
    <p class="empty">그래프나 목록에서 노드나 연결선을 고르면 여기에서 읽고 고칠 수 있습니다.</p>
  </section>
</main>
<script src="/static/vendor/cytoscape-3.30.2.min.js"></script>
<script src="/static/vendor/marked-12.0.2.min.js"></script>
<script src="/static/vendor/purify-3.1.6.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
