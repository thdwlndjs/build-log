[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildlog"
version = "0.1.0"
description = "Local knowledge store for reusable development experience"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
buildlog = "buildlog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
